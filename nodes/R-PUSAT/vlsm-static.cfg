! Konfigurasi R-PUSAT (VLSM Static Routing + NAT + GRE)
hostname R-PUSAT
!
interface GigabitEthernet0/0
 description Link WAN Publik ke R-ISP
 ip address 203.0.113.61 255.255.255.252
 ip nat outside
 no shutdown
!
interface GigabitEthernet0/1
 description LAN Pegawai Balai Kota Surabaya
 ip address 10.120.224.1 255.255.248.0
 ip nat inside
 no shutdown
!
interface GigabitEthernet0/2
 description LAN Web Server Balai Kota Surabaya
 ip address 10.120.241.1 255.255.255.224
 ip nat inside
 no shutdown
!
interface Serial0/0/0
 description Link L1 ke R-DC
 ip address 10.120.241.33 255.255.255.252
 clock rate 64000
 ip nat inside
 no shutdown
!
interface Serial0/0/1
 description Link L2 ke R-UTARA
 ip address 10.120.241.37 255.255.255.252
 clock rate 64000
 ip nat inside
 no shutdown
!
interface Serial0/1/0
 description Link L3 ke R-SELATAN
 ip address 10.120.241.41 255.255.255.252
 clock rate 64000
 ip nat inside
 no shutdown
!
interface Serial0/1/1
 description Link L4 ke R-TIMUR
 ip address 10.120.241.45 255.255.255.252
 clock rate 64000
 ip nat inside
 no shutdown
!
interface Serial0/2/0
 description Link L5 ke R-BARAT
 ip address 10.120.241.49 255.255.255.252
 clock rate 64000
 ip nat inside
 no shutdown
!
interface Tunnel0
 description GRE Tunnel Enkripsi ke R-PELABUHAN
 ip address 192.168.15.1 255.255.255.252
 tunnel source Serial0/0/1
 tunnel destination 10.120.241.54
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 203.0.113.62
ip route 10.120.96.0 255.255.224.0 10.120.241.34
ip route 10.120.239.0 255.255.255.0 10.120.241.34
ip route 10.120.192.0 255.255.224.0 10.120.241.50
ip route 10.120.238.0 255.255.255.0 10.120.241.50
ip route 10.120.0.0 255.255.192.0 10.120.241.38
ip route 10.120.236.0 255.255.254.0 10.120.241.38
ip route 10.120.241.52 255.255.255.252 10.120.241.38
ip route 10.120.128.0 255.255.224.0 10.120.241.46
ip route 10.120.232.0 255.255.252.0 10.120.241.46
ip route 10.120.64.0 255.255.224.0 10.120.241.42
ip route 10.120.240.128 255.255.255.128 10.120.241.42
ip route 10.120.160.0 255.255.224.0 192.168.15.2
ip route 10.120.240.0 255.255.255.128 192.168.15.2
!
ip dhcp excluded-address 10.120.224.1 10.120.224.5
ip dhcp pool POOL-PEGAWAI-BK
 network 10.120.224.0 255.255.248.0
 default-router 10.120.224.1
 dns-server 10.120.239.2
!
access-list 1 permit 10.120.0.0 0.0.255.255
access-list 1 permit 192.168.15.0 0.0.0.3
ip nat inside source list 1 interface GigabitEthernet0/0 overload
!
end
