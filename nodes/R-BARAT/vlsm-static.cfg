! Konfigurasi R-BARAT (VLSM Static Routing + Local DHCP)
hostname R-BARAT
!
interface Serial0/0/0
 description Link L5 ke R-PUSAT
 ip address 10.120.241.50 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0
 description LAN WiFi Publik Surabaya Barat
 ip address 10.120.192.1 255.255.224.0
 no shutdown
!
interface GigabitEthernet0/1
 description LAN Puskesmas & Sekolah Surabaya Barat
 ip address 10.120.238.1 255.255.255.0
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 10.120.241.49
!
ip dhcp excluded-address 10.120.192.1 10.120.192.5
ip dhcp pool POOL-WIFI-BARAT
 network 10.120.192.0 255.255.224.0
 default-router 10.120.192.1
 dns-server 10.120.239.2
!
ip dhcp excluded-address 10.120.238.1 10.120.238.5
ip dhcp pool POOL-PUSKESMAS-BARAT
 network 10.120.238.0 255.255.255.0
 default-router 10.120.238.1
 dns-server 10.120.239.2
!
end
