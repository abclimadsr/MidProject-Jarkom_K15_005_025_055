! Konfigurasi R-UTARA (OSPF Area 0 + Link Redundan L7)
hostname R-UTARA
!
interface Serial0/0/0
 description Link L2 ke R-PUSAT
 ip address 10.120.241.38 255.255.255.252
 no shutdown
!
interface Serial0/0/1
 description Link L6 ke R-PELABUHAN
 ip address 10.120.241.53 255.255.255.252
 clock rate 64000
 no shutdown
!
interface Serial0/1/0
 description Link L7 Cadangan ke R-DC
 ip address 10.120.241.58 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0
 description LAN WiFi Publik Surabaya Utara
 ip address 10.120.0.1 255.255.192.0
 no shutdown
!
interface GigabitEthernet0/1
 description LAN Sensor Lalu Lintas Surabaya Utara
 ip address 10.120.236.1 255.255.254.0
 no shutdown
!
router ospf 1
 router-id 4.4.4.4
 network 10.120.0.0 0.0.63.255 area 0
 network 10.120.236.0 0.0.1.255 area 0
 network 10.120.241.36 0.0.0.3 area 0
 network 10.120.241.52 0.0.0.3 area 0
 network 10.120.241.56 0.0.0.3 area 0
 passive-interface GigabitEthernet0/0
 passive-interface GigabitEthernet0/1
!
ip dhcp excluded-address 10.120.0.1 10.120.0.5
ip dhcp pool POOL-WIFI-UTARA
 network 10.120.0.0 255.255.192.0
 default-router 10.120.0.1
 dns-server 10.120.239.2
!
ip dhcp excluded-address 10.120.236.1 10.120.236.5
ip dhcp pool POOL-SENSOR-LALIN
 network 10.120.236.0 255.255.254.0
 default-router 10.120.236.1
 dns-server 10.120.239.2
!
end
