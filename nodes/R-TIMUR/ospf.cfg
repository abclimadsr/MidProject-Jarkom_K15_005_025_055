! Konfigurasi R-TIMUR (OSPF Area 0)
hostname R-TIMUR
!
interface Serial0/0/0
 description Link L4 ke R-PUSAT
 ip address 10.120.241.46 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0
 description LAN WiFi Publik Surabaya Timur
 ip address 10.120.128.1 255.255.224.0
 no shutdown
!
interface GigabitEthernet0/1
 description LAN Sensor Banjir Surabaya Timur
 ip address 10.120.232.1 255.255.252.0
 no shutdown
!
router ospf 1
 router-id 5.5.5.5
 network 10.120.128.0 0.0.31.255 area 0
 network 10.120.232.0 0.0.3.255 area 0
 network 10.120.241.44 0.0.0.3 area 0
 passive-interface GigabitEthernet0/0
 passive-interface GigabitEthernet0/1
!
ip dhcp excluded-address 10.120.128.1 10.120.128.5
ip dhcp pool POOL-WIFI-TIMUR
 network 10.120.128.0 255.255.224.0
 default-router 10.120.128.1
 dns-server 10.120.239.2
!
ip dhcp excluded-address 10.120.232.1 10.120.232.5
ip dhcp pool POOL-SENSOR-BANJIR
 network 10.120.232.0 255.255.252.0
 default-router 10.120.232.1
 dns-server 10.120.239.2
!
end
