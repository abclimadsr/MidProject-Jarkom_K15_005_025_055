! Konfigurasi R-DC (VLSM Static Routing + DHCP Relay)
hostname R-DC
!
interface Serial0/0/0
 description Link L1 ke R-PUSAT
 ip address 10.120.241.34 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0
 description LAN CCTV Kota Surabaya (DHCP Relay)
 ip address 10.120.96.1 255.255.224.0
 ip helper-address 10.120.239.2
 no shutdown
!
interface GigabitEthernet0/1
 description LAN Server & Storage Data Center
 ip address 10.120.239.1 255.255.255.0
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 10.120.241.33
!
end
