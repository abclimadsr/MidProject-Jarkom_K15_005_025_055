! Konfigurasi R-DC (OSPF Area 0 + Link Redundan L7)
hostname R-DC
!
interface Serial0/0/0
 description Link L1 ke R-PUSAT
 ip address 10.120.241.34 255.255.255.252
 no shutdown
!
interface Serial0/0/1
 description Link L7 Cadangan ke R-UTARA
 ip address 10.120.241.57 255.255.255.252
 clock rate 64000
 no shutdown
!
interface GigabitEthernet0/0
 description LAN CCTV Kota Surabaya (DHCP Relay)
 ip address 10.120.96.1 255.255.224.0
 ip helper-address 10.120.239.2
 no shutdown
!
interface GigabitEthernet0/1
 description LAN Server & Storage Data Center
 ip address 10.120.239.1 255.255.255.0
 no shutdown
!
router ospf 1
 router-id 2.2.2.2
 network 10.120.96.0 0.0.31.255 area 0
 network 10.120.239.0 0.0.0.255 area 0
 network 10.120.241.32 0.0.0.3 area 0
 network 10.120.241.56 0.0.0.3 area 0
 passive-interface GigabitEthernet0/0
 passive-interface GigabitEthernet0/1
!
end
