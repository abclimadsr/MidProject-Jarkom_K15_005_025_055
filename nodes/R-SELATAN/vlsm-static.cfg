! Konfigurasi R-SELATAN (VLSM Static Routing + Local DHCP)
hostname R-SELATAN
!
interface Serial0/0/0
 description Link L3 ke R-PUSAT
 ip address 10.120.241.42 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0
 description LAN WiFi Publik Surabaya Selatan
 ip address 10.120.64.1 255.255.224.0
 no shutdown
!
interface GigabitEthernet0/1
 description LAN PJU Pintar Surabaya Selatan
 ip address 10.120.240.129 255.255.255.128
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 10.120.241.41
!
ip dhcp excluded-address 10.120.64.1 10.120.64.5
ip dhcp pool POOL-WIFI-SELATAN
 network 10.120.64.0 255.255.224.0
 default-router 10.120.64.1
 dns-server 10.120.239.2
!
ip dhcp excluded-address 10.120.240.129 10.120.240.133
ip dhcp pool POOL-PJU-SELATAN
 network 10.120.240.128 255.255.255.128
 default-router 10.120.240.129
 dns-server 10.120.239.2
!
end
