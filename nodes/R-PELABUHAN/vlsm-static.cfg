! Konfigurasi R-PELABUHAN (VLSM Static Routing + GRE Tunnel + Local DHCP)
hostname R-PELABUHAN
!
interface Serial0/0/0
 description Link L6 ke R-UTARA
 ip address 10.120.241.54 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0
 description LAN Sensor & SCADA Pelabuhan Tanjung Perak
 ip address 10.120.160.1 255.255.224.0
 no shutdown
!
interface GigabitEthernet0/1
 description LAN Kantor Pelabuhan Tanjung Perak
 ip address 10.120.240.1 255.255.255.128
 no shutdown
!
interface Tunnel0
 description GRE Tunnel Enkripsi ke R-PUSAT
 ip address 192.168.15.2 255.255.255.252
 tunnel source Serial0/0/0
 tunnel destination 10.120.241.37
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 10.120.241.53
ip route 10.120.224.0 255.255.248.0 192.168.15.1
ip route 10.120.241.0 255.255.255.224 192.168.15.1
!
ip dhcp excluded-address 10.120.160.1 10.120.160.5
ip dhcp pool POOL-SCADA-PELABUHAN
 network 10.120.160.0 255.255.224.0
 default-router 10.120.160.1
 dns-server 10.120.239.2
!
ip dhcp excluded-address 10.120.240.1 10.120.240.5
ip dhcp pool POOL-KANTOR-PELABUHAN
 network 10.120.240.0 255.255.255.128
 default-router 10.120.240.1
 dns-server 10.120.239.2
!
end
